version: '3.8'

services:
  dragon-eyes:
    build: .
    container_name: dragon-eyes-sync
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - dragon_media:/app/media
      - dragon_uploads:/app/uploads

volumes:
  dragon_media:
  dragon_uploads:

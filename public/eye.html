<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dragon Eye - OLED</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/eye.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
</head>
<body class="oled-bg">

  <!-- Viewport Container for OLED Video -->
  <div id="viewport-container">
    <video
      id="eye-video"
      playsinline
      muted
      preload="auto"
      disablepictureinpicture
    ></video>
  </div>

  <!-- Synchronized Audio for Eye Device -->
  <audio id="eye-audio" playsinline preload="auto"></audio>

  <!-- Touch Manipulation Surface (1 Finger Pan, 2 Fingers Pinch-to-zoom/dézoom) -->
  <div id="touch-surface"></div>

  <!-- Pure OLED Black Standby Overlay (Zero text, zero notification, 100% pure black) -->
  <div id="standby-overlay" class="active"></div>

  <!-- Corner Framing Validation Button (Disappears completely once validated) -->
  <button id="btn-validate-framing" class="corner-validate-btn" type="button">
    ✓ Valider le cadrage
  </button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sync-engine.js"></script>
  <script src="/js/media-cache.js"></script>
  <script src="/js/eye.js"></script>
</body>
</html>

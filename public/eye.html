<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dragon Eye - OLED</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/eye.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
</head>
<body class="oled-bg">

  <!-- Viewport Container for OLED Video -->
  <div id="viewport-container">
    <video
      id="eye-video"
      playsinline
      muted
      preload="auto"
      disablepictureinpicture
    ></video>
  </div>

  <!-- Synchronized Audio for Eye Device -->
  <audio id="eye-audio" playsinline preload="auto"></audio>

  <!-- Touch Manipulation Surface (1 Finger Pan, 2 Fingers Pinch-to-zoom/dézoom) -->
  <div id="touch-surface"></div>

  <!-- Pure OLED Black Standby Overlay (Zero text, zero notification, 100% pure black) -->
  <div id="standby-overlay" class="active"></div>

  <!-- Discreet Calibration Overlay (Only visible in manual calibration mode) -->
  <div id="calib-overlay" class="calib-overlay hidden">
    <div class="calib-pill">
      <span id="calib-role-label" class="calib-title">📐 Calibrage Tactile</span>
      <span class="calib-hint">1 doigt: déplacer • 2 doigts: zoom/dézoom</span>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button id="btn-calib-validate" class="btn-calib-done">✓ Valider & Écran Noir</button>
        <button id="btn-calib-reset" class="btn-calib-reset">↺ Recentrer</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sync-engine.js"></script>
  <script src="/js/eye.js"></script>
</body>
</html>
